# vietmap-cluster (kit/vietmap-cluster): while the VietMap on cluster app is on,
# /run/vietmap-cluster/woc.env sets WOC_SRC_CROP to "-s avb_stream= -s src_crop=<crop>", read after
# waze-on-cluster's own aa-crop.env, so the copied centre screen is the map. Otherwise (and after
# every boot: /run is in memory) the file is not there and waze-on-cluster runs as installed.
[Service]
EnvironmentFile=-/run/vietmap-cluster/woc.env
